<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Brand mark favicon: dark-ink on light browser chrome, light-ink on dark. -->
		<link
			rel="icon"
			type="image/png"
			href="/assets/ai-14all-mark-dark.png"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/png"
			href="/assets/ai-14all-mark-light.png"
			media="(prefers-color-scheme: dark)"
		/>
		<title>ai-14all — insights</title>
		<style>
			/* Full-size host (spec §2 decision 1, v5): the height chain lets the
			   .idb-shell fill the window viewport — #root is the flex-column
			   parent its flex:1 grows in. */
			html,
			body {
				margin: 0;
				height: 100%;
			}
			#root {
				height: 100%;
				display: flex;
				flex-direction: column;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/dashboard.tsx"></script>
	</body>
</html>
